name: Docker

# Публикация образа в Docker Hub. Раньше это был job `deploy` внутри nodejs.yml
# рядом с прогоном тестов; тесты переехали в nodeci.yml (пулреквесты) и в
# release-please.yml (релиз), поэтому здесь остался только образ.
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false

      # Образ собирается только после зелёных проверок: иначе в Docker Hub
      # уезжает сломанная сборка, а узнают об этом те, кто её вытянет.
      - run: make install
      - run: make lint
      - run: make test

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          cache-from: hexletcomponents/react-todo-app-with-backend:latest
          cache-to: type=inline
          tags: hexletcomponents/react-todo-app-with-backend:latest
