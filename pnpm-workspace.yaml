# pnpm с 10-й версии не запускает build-скрипты зависимостей без явного
# разрешения, и на неразрешённом падает вся установка. Поэтому решение по
# каждому пакету принимается здесь явно.
#
# lefthook стоит false намеренно. Его build-скрипт ставит git-хуки, а внутри
# дерева hexlet-exercise-kit core.hooksPath ведёт в общий каталог кита, и
# автоустановка записала бы хуки этого репозитория всем остальным. Хук ставится
# руками: `pnpm exec lefthook install`.
#
# Файл пишется целиком: pnpm при отказе дописывает сюда свой блок с заглушками,
# и дописывание сверху даёт дубль ключа, на котором YAML перестаёт разбираться.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lefthook: false
  simple-git-hooks: set this to true or false
